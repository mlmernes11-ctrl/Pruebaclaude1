# Manda los cambios de la app a los celulares que ya tienen el APK instalado, sin reinstalar
# (EAS Update). Al abrir la app aparece el cartel "Hay una nueva versión" y se actualiza al aceptar.
# Se corre a mano desde GitHub › Actions › "Actualizar la app" › Run workflow.
# Sirve para cambios de pantallas y lógica; si cambia algo nativo (permisos, ícono, paquetes
# nativos) hace falta un APK nuevo con "Armar APK".
name: Actualizar la app

on:
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Antes de mandar nada, se revisa el código: si algo falla, no se publica.
      - run: npm run typecheck
      - run: npm test
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - run: eas update --channel main --environment preview --platform android --message "$(git log -1 --pretty=%s)" --non-interactive
